cat > ~/Desktop/fireworks.html <<'HTML'
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>辞暮尔尔，烟火年年，爱琦琦</title>
  <style>
    html,body{margin:0;height:100%;background:#05060a;overflow:hidden;user-select:none}
    canvas{display:block}

    /* 顶部祥云红光晕 */
    .top-glow{
      position:fixed; inset:0; pointer-events:none;
      background:
              radial-gradient(900px 420px at 50% -10%, rgba(180,0,0,0.30), transparent 70%),
              radial-gradient(680px 320px at 20% 0%, rgba(255,180,120,0.12), transparent 72%),
              radial-gradient(680px 320px at 80% 0%, rgba(255,120,180,0.10), transparent 72%);
      mix-blend-mode: screen;
    }

    .poem{
      position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);
      text-align:center;pointer-events:none;color:rgba(255,255,255,.93);
      font-family:"Songti SC","STSong","PingFang SC","Microsoft YaHei",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      letter-spacing:.12em;mix-blend-mode:screen;
      text-shadow:
              0 0 calc(12px * var(--g,1)) rgba(255,255,255,0.28),
              0 0 calc(30px * var(--g,1)) hsla(var(--h,42),100%,70%,0.22),
              0 0 calc(44px * var(--g,1)) hsla(var(--h2,320),100%,65%,0.14);
      filter:saturate(1.08) brightness(1.05);
    }
    .poem .main{
      font-size:clamp(26px,4.2vw,54px);
      font-weight:700;
      line-height:1.12;
      opacity:calc(.82 + .18*var(--g,1));
    }
    .poem .wish{
      margin-top:10px;
      font-size:clamp(26px, 1.8vw, 18px);
      opacity:0.80;
      letter-spacing:0.16em;
    }
    .poem .sub{
      margin-top:8px;
      font-size:clamp(11px,1.2vw,14px);
      opacity:.60;
      letter-spacing:.18em;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>

<div class="top-glow"></div>

<div class="poem" id="poem">
  <div class="main">辞暮尔尔，烟火年年</div>
  <div class="wish">祝我的琦琦岁岁欢愉</div>
  <div class="sub">点一下页面解锁声音(^_^)</div>
</div>

<script>
  (() => {
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d", { alpha:false });
    const poemEl = document.getElementById("poem");

    function resize(){
      const dpr = 1.0;
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    window.addEventListener("resize", resize, {passive:true});
    resize();

    const rand=(a,b)=>a+Math.random()*(b-a);
    const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

    const GRAVITY=0.09, DRAG=0.985;
    const TRAIL_FADE=0.22;

    const MAX_SPARKS=1900;
    const MAX_CONFETTI=120;
    const MAX_RINGS=26;
    const MAX_ROCKETS=5;

    const rockets=[];
    const sparks=[];
    const confetti=[];
    const rings=[];

    class Rocket{
      constructor(x, yStart, yTarget){
        this.x = x;
        this.y = yStart;
        this.yTarget = yTarget;
        this.vy = rand(-9.2, -11.4);
        this.life = 0;
        this.maxLife = rand(44, 62);
        const palette = [0, 8, 350, 42, 48, 300, 320];
        this.hue = (palette[(Math.random()*palette.length)|0] + rand(-6,6) + 360) % 360;
        this.px = x; this.py = yStart;
      }
      update(){
        this.life++;
        this.px = this.x;
        this.py = this.y;

        this.vy = this.vy * 0.996 + GRAVITY*0.05;
        this.y += this.vy;

        const reach = (this.y <= this.yTarget);
        const timeUp = (this.life >= this.maxLife);
        if (reach || timeUp) {
          explode(this.x, this.y, this.hue);
          return true;
        }
        return false;
      }
      draw(){
        ctx.strokeStyle = `hsla(${this.hue},100%,72%,0.60)`;
        ctx.lineWidth = 2.0;
        ctx.beginPath();
        ctx.moveTo(this.px, this.py);
        ctx.lineTo(this.x, this.y);
        ctx.stroke();

        ctx.fillStyle = `hsla(${this.hue},100%,74%,0.92)`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2.3, 0, Math.PI*2);
        ctx.fill();
      }
    }

    class Spark{
      constructor(x,y,vx,vy,hue){
        this.x=x; this.y=y; this.vx=vx; this.vy=vy;
        this.hue=hue;
        this.a=1;
        this.decay=rand(0.015,0.028);
        this.r=rand(1.4,2.6);
      }
      update(){
        this.vx*=DRAG; this.vy=this.vy*DRAG+GRAVITY;
        this.x+=this.vx; this.y+=this.vy;
        this.a-=this.decay;
      }
      draw(){
        if(this.a<=0) return;
        ctx.fillStyle = `hsla(${this.hue},100%,66%,${clamp(this.a,0,1)})`;
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
        ctx.fill();
      }
    }

    class Confetti{
      constructor(x,y){
        this.x=x; this.y=y;
        this.vx=rand(-1.8,1.8);
        this.vy=rand(-2.2,0.6);
        this.len=rand(6,12);
        this.a=rand(0.75,1.0);
        this.decay=rand(0.010,0.018);
        const palette = [45, 48, 42, 0, 320];
        this.hue = (palette[(Math.random()*palette.length)|0] + rand(-8,8) + 360) % 360;
        this.rot = rand(0, Math.PI*2);
        this.rotV = rand(-0.18, 0.18);
      }
      update(){
        this.vx*=0.992;
        this.vy = this.vy*0.992 + GRAVITY*0.55;
        this.x += this.vx;
        this.y += this.vy;
        this.rot += this.rotV;
        this.a -= this.decay;
      }
      draw(){
        if(this.a<=0) return;
        ctx.strokeStyle = `hsla(${this.hue},100%,70%,${clamp(this.a,0,1)})`;
        ctx.lineWidth = 1.6;
        const dx = Math.cos(this.rot) * this.len;
        const dy = Math.sin(this.rot) * this.len;
        ctx.beginPath();
        ctx.moveTo(this.x - dx*0.5, this.y - dy*0.5);
        ctx.lineTo(this.x + dx*0.5, this.y + dy*0.5);
        ctx.stroke();
      }
    }

    class Ring{
      constructor(x,y,hue){
        this.x=x; this.y=y;
        this.r=rand(10,18);
        this.v=rand(2.6,4.2);
        this.a=rand(0.55,0.75);
        this.decay=rand(0.012,0.018);
        this.hue = (hue + rand(-10,10) + 360) % 360;
      }
      update(){
        this.r += this.v;
        this.a -= this.decay;
      }
      draw(){
        if(this.a<=0) return;
        ctx.lineWidth = 2.0;
        ctx.strokeStyle = `hsla(${this.hue},100%,68%,${clamp(this.a,0,1)})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
        ctx.stroke();

        ctx.lineWidth = 1.0;
        ctx.strokeStyle = `hsla(${this.hue},100%,72%,${clamp(this.a*0.45,0,1)})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(0,this.r*0.62), 0, Math.PI*2);
        ctx.stroke();
      }
    }

    // ===== 离线音效（WebAudio）=====
    let audioCtx=null, masterGain=null, unlocked=false;

    function ensureAudio(){
      if (audioCtx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.58;
      masterGain.connect(audioCtx.destination);
    }
    async function unlockAudio(){
      ensureAudio();
      if (!audioCtx) return;
      if (audioCtx.state === "suspended") { try { await audioCtx.resume(); } catch {} }
      unlocked = true;
    }
    function makeNoiseBuffer(duration){
      const sr = audioCtx.sampleRate;
      const len = Math.max(1, Math.floor(sr * duration));
      const buf = audioCtx.createBuffer(1, len, sr);
      const data = buf.getChannelData(0);
      for (let i=0;i<len;i++) data[i] = (Math.random()*2-1) * (1 - i/len);
      return buf;
    }
    function playBoom(intensity=1){
      if (!audioCtx || !unlocked) return;
      const t = audioCtx.currentTime;

      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.36 * intensity, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
      g.connect(masterGain);

      const o = audioCtx.createOscillator();
      o.type = "sine";
      const base = 72 + rand(-8, 8);
      o.frequency.setValueAtTime(base, t);
      o.frequency.exponentialRampToValueAtTime(38, t + 0.28);
      o.connect(g);

      const ns = audioCtx.createBufferSource();
      ns.buffer = makeNoiseBuffer(0.18);
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.0001, t);
      ng.gain.exponentialRampToValueAtTime(0.16 * intensity, t + 0.005);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
      ns.connect(ng); ng.connect(masterGain);

      o.start(t); o.stop(t + 0.48);
      ns.start(t); ns.stop(t + 0.2);
    }
    function playCrackle(intensity=1){
      if (!audioCtx || !unlocked) return;
      const t0 = audioCtx.currentTime;
      const n = Math.floor(8 + 12 * intensity);
      for (let i=0;i<n;i++){
        const t = t0 + rand(0.02, 0.28);
        const src = audioCtx.createBufferSource();
        src.buffer = makeNoiseBuffer(0.05 + rand(0,0.03));

        const bp = audioCtx.createBiquadFilter();
        bp.type="bandpass";
        bp.frequency.setValueAtTime(1500 + rand(-450, 650), t);
        bp.Q.value = 2.2 + rand(0,4);

        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime((0.07 + rand(0,0.12))*intensity, t+0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t+0.07+rand(0,0.05));

        src.connect(bp); bp.connect(g); g.connect(masterGain);
        src.start(t); src.stop(t + 0.12);
      }
    }

    function explode(x,y,hueBase){
      const count = Math.floor(rand(90,140));
      const power = rand(3.2,5.2);

      const intensity = clamp(count/140, 0.6, 1.15);
      playBoom(intensity);
      playCrackle(intensity);

      for(let i=0;i<count;i++){
        const a = (i/count)*Math.PI*2 + rand(-0.03,0.03);
        const sp = power * rand(0.7,1.2);
        const vx = Math.cos(a)*sp;
        const vy = Math.sin(a)*sp;
        const hue = (hueBase + rand(-18,18) + 360) % 360;
        sparks.push(new Spark(x,y,vx,vy,hue));
      }
      if(sparks.length>MAX_SPARKS) sparks.splice(0, sparks.length-MAX_SPARKS);

      const ringN = (Math.random()<0.55) ? 2 : 1;
      for(let i=0;i<ringN;i++){
        rings.push(new Ring(x,y, 45 + rand(-8,8)));
      }
      if(rings.length>MAX_RINGS) rings.splice(0, rings.length-MAX_RINGS);

      const confN = Math.floor(rand(10, 18));
      for(let i=0;i<confN;i++) confetti.push(new Confetti(x,y));
      if(confetti.length>MAX_CONFETTI) confetti.splice(0, confetti.length-MAX_CONFETTI);

      bumpPoemGlow(hueBase, 1.35);
    }

    function launch(){
      const x = rand(window.innerWidth*0.18, window.innerWidth*0.82);
      const yStart = window.innerHeight + 12;

      const yTarget = (Math.random() < 0.90)
              ? rand(window.innerHeight*0.03, window.innerHeight*0.20)
              : rand(window.innerHeight*0.18, window.innerHeight*0.36);

      if (rockets.length < MAX_ROCKETS) rockets.push(new Rocket(x, yStart, yTarget));
    }

    let glowPulse=0, glowHue=320, glowHue2=42, t=0;
    function bumpPoemGlow(hue, amount){
      glowHue = hue;
      glowHue2 = 42;
      glowPulse = Math.min(2.2, glowPulse + 0.85*amount);
    }
    function updatePoemGlow(){
      glowPulse *= 0.92;

      const breathe = 0.74 + 0.34*Math.sin(t*0.020);
      const shimmer = 0.03*Math.sin(t*0.10);
      const g = breathe + shimmer + glowPulse;

      poemEl.style.setProperty("--g", g.toFixed(3));
      poemEl.style.setProperty("--h", String(Math.round(glowHue)));
      poemEl.style.setProperty("--h2", String(Math.round(glowHue2)));
    }

    function frame(){
      t++;

      ctx.fillStyle = `rgba(5,6,10,${TRAIL_FADE})`;
      ctx.fillRect(0,0,window.innerWidth,window.innerHeight);

      for(let i=rings.length-1;i>=0;i--){
        const r = rings[i];
        r.update(); r.draw();
        if(r.a<=0) rings.splice(i,1);
      }

      for(let i=rockets.length-1;i>=0;i--){
        const r = rockets[i];
        const dead = r.update();
        r.draw();
        if(dead) rockets.splice(i,1);
      }

      for(let i=sparks.length-1;i>=0;i--){
        const s=sparks[i];
        s.update(); s.draw();
        if(s.a<=0) sparks.splice(i,1);
      }

      for(let i=confetti.length-1;i>=0;i--){
        const c=confetti[i];
        c.update(); c.draw();
        if(c.a<=0) confetti.splice(i,1);
      }

      if (t % 60 === 0 && Math.random() < 0.62) launch();

      if (t % 3 === 0) updatePoemGlow();
      requestAnimationFrame(frame);
    }

    ctx.fillStyle="#05060a";
    ctx.fillRect(0,0,window.innerWidth,window.innerHeight);
    requestAnimationFrame(frame);

    // 第一次用户交互解锁声音
    window.addEventListener("pointerdown", async ()=>{
      if (!unlocked) await unlockAudio();
    }, {passive:true});
  })();
</script>
</body>
</html>
